name: CTI RADAR - Collect and Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'sources.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'site/index.html'
      - 'site/assets/**'
      - '.github/workflows/cti-dashboard.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cti-radar-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect CTI sources
        env:
          NEWS_MODE: all
          LOOKBACK_HOURS: '72'
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OPENCVE_TOKEN: ${{ secrets.OPENCVE_TOKEN }}
          VULNCHECK_API_TOKEN: ${{ secrets.VULNCHECK_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: python collect.py
      - name: Persist archive to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/feed.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "data: refresh CTI feed [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
