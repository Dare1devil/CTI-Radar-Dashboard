name: CTI RADAR - Collect and Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'sources.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'site/index.html'
      - 'site/assets/**'
      - '.github/workflows/cti-dashboard.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cti-radar-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect CTI sources
        env:
          NEWS_MODE: all
          LOOKBACK_HOURS: '72'
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OPENCVE_TOKEN: ${{ secrets.OPENCVE_TOKEN }}
          VULNCHECK_API_TOKEN: ${{ secrets.VULNCHECK_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: python collect.py
      # Keep the freshly collected snapshot outside the Git working tree.
      # The repository may advance while the collector is fetching sources.
      - name: Preserve collected snapshot
        shell: bash
        run: cp site/data/feed.json "$RUNNER_TEMP/cti-collected-feed.json"
      - name: Persist archive to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Updating CTI archive (attempt ${attempt}/5)"
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_feed.py \
              --existing site/data/feed.json \
              --incoming "$RUNNER_TEMP/cti-collected-feed.json" \
              --output site/data/feed.json
            if git diff --quiet -- site/data/feed.json; then
              echo "No archive changes to commit."
              break
            fi
            git add site/data/feed.json
            git commit -m "data: refresh CTI feed [skip ci]"
            if git push origin HEAD:main; then
              echo "State persisted."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Could not persist feed after five attempts."
              exit 1
            fi
            sleep "$attempt"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
